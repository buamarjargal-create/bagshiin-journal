<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Багшийн журнал</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233e6fa3'/%3E%3Cpath d='M20 44c0-14 10-24 26-26-2 16-12 26-26 26z' fill='%23f7f5f0'/%3E%3Cpath d='M20 44l16-16' stroke='%233e6fa3' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Сүүн зөөлөн цэнхэр + цагаан */
  --bg:#EEF4FA; --card:#FFFFFF; --ink:#1E2B3A; --muted:#66788C; --line:#D9E4EF;
  --teal:#3E6FA3; --teal-d:#2F5A88; --teal-l:#E3EDF8;
  --sage:#4F8C6B; --sage-l:#E2F0E8; --coral:#B9534A; --coral-l:#FBE8E5;
  --sand:#A77A22; --sand-l:#FAF0DA; --sky:#3E6FA3; --sky-l:#E3EDF8; --lav:#6159A0; --lav-l:#ECEAF7;
  --soft:#F4F8FC; --day:#F1F6FC; --dayline:#BCD0E6; --r:12px;
  --shadow:0 1px 2px rgba(30,43,58,.05),0 2px 10px rgba(30,43,58,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--teal-l)}
.app{display:flex;gap:22px;padding:22px;min-height:100vh;align-items:flex-start}
.side{position:sticky;top:22px;flex:none;width:96px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:calc(100vh - 44px)}
.side .logo{width:44px;height:44px;border-radius:10px;background:var(--teal-l);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.side .logo svg{width:24px;height:24px}
nav{display:flex;flex-direction:column;gap:4px;width:100%}
nav button{border:0;background:transparent;padding:10px 4px;border-radius:8px;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;width:100%;transition:background .15s,color .15s}
nav button svg{width:21px;height:21px}
nav button:hover{background:var(--soft);color:var(--ink)}
nav button.on{background:var(--teal);color:#fff;font-weight:600}
.wrap{flex:1;min-width:0;padding:8px 8px 24px;min-height:calc(100vh - 44px)}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.htitle{font-weight:700;font-size:15px;letter-spacing:.1px}
.htitle small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.pick{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=date],input[type=number],textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
select{cursor:pointer}
select:focus,input:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l)}
main{max-width:1320px}
@media(max-width:760px){.app{flex-direction:column;padding:10px;gap:10px}.side{position:static;width:100%;min-height:0;flex-direction:row;padding:8px;border-radius:12px;overflow-x:auto}.side .logo{display:none}nav{flex-direction:row}nav button{min-width:68px}.wrap{padding:6px}}
h1{font-size:24px;margin:0 0 4px;font-weight:700;letter-spacing:-.2px}
h2{font-size:18px;margin:0 0 12px;font-weight:700}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cls{cursor:default;transition:transform .15s,box-shadow .15s}
.cls:hover{transform:translateY(-2px)}
.cls .nm{font-size:20px;font-weight:700}
.tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:999px;background:var(--sage-l);color:var(--teal-d);margin-left:6px;vertical-align:middle;font-weight:700}
.tag.el{background:var(--lav-l);color:var(--lav)}
.kv{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:6px}
.kv b{color:var(--ink);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 15px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:600;transition:all .15s}
.btn:hover{border-color:#BCD0E6;background:#fff}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 4px 12px rgba(62,111,163,.22)}
.btn.pri:hover{background:var(--teal-d)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--soft)}
.btn.dan{color:var(--coral)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:10px}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid #E7EEF6;text-align:left;white-space:nowrap}
th{font-size:12px;color:#4A5D72;font-weight:600;background:var(--soft);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
.tw{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow)}
.tw table th:first-child,.tw table td:first-child{position:sticky;left:0;background:inherit;z-index:1}
.tw tr{background:var(--card)}
.tw tbody tr:nth-child(even){background:#FAFCFE}
.tw tbody tr:hover{background:#EAF2FA}
.tw tbody tr:last-child td{border-bottom:0}
.tw thead tr{background:var(--soft)}
.tw thead th{z-index:2;border-bottom:1px solid var(--line)}
.tw thead th:first-child{z-index:3}
.tw td:first-child{font-weight:600}
.subcl{color:var(--muted);font-size:12px;margin-left:4px;font-weight:500}
input.sc{width:50px;text-align:center;padding:5px 4px;border-radius:6px;border:1px solid transparent;background:#F1F6FB;font-weight:700;font-variant-numeric:tabular-nums;transition:background .12s,border-color .12s}
input.sc:hover{border-color:#BCD0E6;background:#fff}
input.sc:focus{background:#fff}
input.sc.bad{border-color:var(--coral);background:var(--coral-l)}
input.sc.abs{background:var(--coral-l);color:var(--coral);cursor:not-allowed;opacity:1}
input.sc.exc{border:1px dashed var(--coral);color:var(--coral)}
.ah{cursor:pointer;line-height:1.25}
.tw td.dg1,.tw th.dg1{background-color:rgba(62,111,163,.055)}
.tw td.ds,.tw th.ds{border-left:2px solid var(--dayline)}
.tw thead tr.grp th{height:36px;padding:6px 10px;background:var(--teal-l);color:var(--teal-d);font-size:12.5px;font-weight:700;border-bottom:1px solid var(--dayline)}
.tw thead tr.grp th.dg1{background:#D6E4F3}
.tw thead tr.grp th .wd{font-weight:500;color:#4A6C92;margin-left:4px}
.tw thead tr.sub2 th{top:36px}
.tw thead tr.grp th[rowspan]{vertical-align:bottom;background:var(--soft);color:#4A5D72}
.ah:hover{color:var(--ink)}
.ah .t{display:block;color:var(--ink);font-weight:700;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.ah .m{font-size:11px}
.pill{display:inline-block;min-width:26px;text-align:center;padding:2px 8px;border-radius:999px;font-weight:700;font-size:12px}
.L-A{background:var(--sage-l);color:#4E7A55}.L-B{background:var(--sky-l);color:#4A6E8F}.L-C{background:var(--sand-l);color:#8A6A1F}.L-D{background:var(--lav-l);color:#6E5A92}.L-F{background:var(--coral-l);color:#A8573D}.L-x{background:#EDF3F9;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line);font-size:13px}
.seg button:last-child{border-right:0}
.seg button.on.p{background:var(--sage-l);color:#4E7A55;font-weight:700}
.seg button.on.х{background:var(--sand-l);color:#8A6A1F;font-weight:700}
.seg button.on.ч{background:var(--sky-l);color:#4A6E8F;font-weight:700}
.seg button.on.ө{background:var(--lav-l);color:#6E5A92;font-weight:700}
.seg button.on.т{background:var(--coral-l);color:#A8573D;font-weight:700}
.mk{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:7px;font-size:12px;font-weight:700;text-align:center}
.mk.х{background:var(--sand-l);color:#8A6A1F}.mk.ч{background:var(--sky-l);color:#4A6E8F}.mk.ө{background:var(--lav-l);color:#6E5A92}.mk.т{background:var(--coral-l);color:#A8573D}
.mk.p{color:#C2CFDD}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow)}
.stat .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:110px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px;color:var(--muted)}
.bar i{display:block;width:100%;border-radius:10px 10px 5px 5px;min-height:3px}
.bar b{color:var(--ink);font-weight:700}
.lvl{font-size:12px;color:var(--muted)}
.lvl b{font-weight:700;color:var(--ink)}
.up{color:#4E7A55}.down{color:#A8573D}
.banner{background:var(--sand-l);border:1px solid #EAD9AE;color:#7A5C22;border-radius:8px;padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.modal{position:fixed;inset:0;background:rgba(30,43,58,.30);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal .box{background:var(--card);border-radius:8px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(30,43,58,.18)}
.modal .box.wide{width:min(760px,100%)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label{font-size:12px;color:var(--muted);font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.hint{color:var(--muted);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.two{grid-template-columns:1fr}.pick{margin-left:0}}
/* Хуваарь */
.wk{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:14px;min-width:1000px}
.wkx{overflow-x:auto;padding-bottom:4px}
.day{display:flex;flex-direction:column;gap:12px;min-width:0}
.dh{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:13px 15px}
.dh b{font-size:17px;font-weight:700}
.dh span{float:right;font-size:12px;color:var(--muted);margin-top:3px}
.dh small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.day.today .dh{background:var(--teal);border-color:var(--teal);color:#fff}
.day.today .dh span,.day.today .dh small{color:#DCE8F5}
.les{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:11px;cursor:pointer;text-align:left;width:100%;transition:border-color .15s,transform .15s,box-shadow .15s;box-shadow:var(--shadow)}
.les:hover{border-color:#BCD0E6;transform:translateY(-2px)}
.les .tm{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.les .tm i{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:999px;padding:3px 9px}
.les .who{display:flex;align-items:center;gap:10px}
.les .who > span{flex:none;width:40px;height:40px;border-radius:8px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.les .who b{display:block;font-size:15px}
.les .who small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.les .ft{border-top:1px dashed var(--line);padding-top:9px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.les.now{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-l)}
.bell div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.bell div:last-child{border-bottom:0}
.bell b{font-variant-numeric:tabular-nums}
.todayrow{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-bottom:18px}
/* Student card */
.scard{border:1px solid var(--line);border-radius:12px;padding:20px 22px;background:var(--card);page-break-inside:avoid;break-inside:avoid;margin-bottom:16px}
.scard .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.scard .who{font-size:18px;font-weight:700}
.scard .big{font-size:30px;font-weight:700;text-align:right;line-height:1}
.scard table td,.scard table th{padding:5px 6px}
.path{display:flex;gap:4px;margin:12px 0 6px}
.path span{flex:1;text-align:center;font-size:11px;padding:6px 2px;border-radius:10px;background:#EDF3F9;color:var(--muted)}
.path span.on{background:var(--sage);color:#fff;font-weight:700}
.path span.done{background:var(--sage-l);color:#4E7A55}
.cmt{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;min-height:40px;white-space:pre-wrap}
/* Projector */
#proj{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
#proj .t{font-size:clamp(22px,3vw,40px);font-weight:700;margin-bottom:6px}
#proj .s{color:var(--muted);font-size:clamp(14px,1.6vw,22px);margin-bottom:30px}
#proj .plants{display:flex;gap:clamp(12px,3vw,48px);align-items:flex-end;height:50vh;width:min(1100px,100%)}
#proj .pl{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
#proj .pl .c{font-size:clamp(22px,3vw,44px);font-weight:700}
#proj .pl .stem{width:60%;border-radius:8px 24px 8px 8px;background:var(--sage);opacity:.9;min-height:8px;transition:height .8s}
#proj .pl .n{margin-top:10px;font-size:clamp(13px,1.5vw,20px);text-align:center}
#proj .avg{margin-top:36px;font-size:clamp(16px,2vw,26px);color:var(--muted)}
#proj .avg b{color:var(--ink)}
#proj .x{position:absolute;top:16px;right:20px}
#printArea{display:none}
@media print{
  body.printing > *:not(#printArea){display:none !important}
  body.printing #printArea{display:block}
  body{background:#fff}
  .scard{border-color:#ccc}
  @page{margin:14mm}
  .noprint{display:none !important}
  body.printing-sum header,body.printing-sum .side,body.printing-sum .noprint{display:none !important}
  body.printing-sum .app{display:block;padding:0}body.printing-sum .wrap{border:0;padding:0;background:#fff}
  body.printing-sum main{padding:0;max-width:none}
  body.printing-sum .tw{max-height:none;overflow:visible;border:0;box-shadow:none}
  body.printing-sum th{position:static}
}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#2F5A88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4C10 4 5 9 5 16c0 1.4.3 2.7.8 4M5.8 20C8 14 12 10 17 8"/></svg></div>
  <nav id="nav" aria-label="Үндсэн цэс"></nav>
</aside>
<div class="wrap">
<header>
  <div class="htitle">Багшийн журнал<small id="hdrSub"></small></div>
  <div class="pick">
    <select id="selClass" title="Анги"></select>
    <select id="selTerm" title="Улирал"></select>
  </div>
</header>
<main id="main"></main>
</div>
</div>
<div id="printArea"></div>
<div class="toast" id="toast"></div>

<script>
/* ================== Өгөгдөл ================== */
const KEY = 'bagsh-journal-v1';
const LEVELS = ['Эс','Эд','Эрхтэн','Эрхтэн тогтолцоо','Организм'];
const ATT = [
  {k:'',  l:'Ирсэн',   c:'p'},
  {k:'х', l:'Хоцорсон',c:'х'},
  {k:'ч', l:'Чөлөөтэй',c:'ч'},
  {k:'ө', l:'Өвчтэй',  c:'ө'},
  {k:'т', l:'Тасалсан',c:'т'}
];
let S;
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmt = (v, d=0) => v==null || isNaN(v) ? '—' : (Math.round(v*10**d)/10**d).toString();
const mnSort = (a,b) => a.localeCompare(b,'mn');
const givenName = n => String(n||'').replace(/^\s*\S{1,3}\.\s*/,'');
const nameSort = (a,b) => mnSort(givenName(a.name),givenName(b.name)) || mnSort(a.name,b.name);

function seed(){
  const mk = (name, kind, grade, list) => ({id:uid(), name, kind, grade, students:(list||[]).map(([n,sub]) => ({id:uid(), name:n, sub:sub||''}))});
  const g = (sub, names) => names.map(n => [n, sub]);
  const e10 = [
    ...g('10а',['Б. Мөнхбат','Содномиш']),
    ...g('10б',['Төгөлдөр','Д. Саруул','Н. Дөлгөөн','Эрдэнэ','Баттүшиг']),
    ...g('10д',['М. Мишээл','Э. Хүслэн','Ангараг','Ихбаяр','Маралжин','Тэргэл','Ариунболд','М. Үжин','Г. Бүжин','Э. Сарангэрэл','А. Амарзаяа','Э. Хүслэн (2)','А. Анхмаа','Б. Энхжин','Б. Төгсбаяр','О. Уранзаяа','О. Наранхүү']),
    ...g('10е',['Б. Нандин','Г. Бөртэ','Эмүжин','Б. Мөнхзул','И. Мөнхжаргал','Сар-Уул'])
  ];
  const e11 = [
    ...g('11а',['Цэцэнбилэг (?)','Билэгжаргал','Цэлмэг','Пүрэвочир','Анар']),
    ...g('11б',['Билэгт','Анужин','Сувд-Эрдэнэ','Санчир','Анар-Цэцэг']),
    ...g('11в',['Батхишиг','Төгсочир','Мөнхтүшиг','Дөлгөөн','Санчир','Азжаргал','Сүлд-Эрдэнэ','Учрал','Б. Ганбат']),
    ...g('11г',['Санчир','М. Сондор','Мөнххүслэн','А. Энхжин','Энхцэцэг','Ганцолмон','Хан-Эрдэнэ','Баяржаргал','Золзаяа','Мишээл'])
  ];
  const classes = [
    mk('10 сонгон','Сонгон',10,e10),
    mk('11 сонгон','Сонгон',11,e11),
    mk('10А','Үндсэн',10), mk('10В','Үндсэн',10), mk('10Е','Үндсэн',10),
    mk('11А','Үндсэн',11), mk('11Г','Үндсэн',11)
  ];
  return {
    version:1,
    settings:{

function load(){

  S = seed(); save();
}
function fix(){
  S.ui = S.ui || {}; S.ui.view ||= 'home'; S.ui.term ||= 1; S.ui.date ||= today(); S.ui.sort ||= 'name';
  if(!S.classes.find(c => c.id===S.ui.classId)) S.ui.classId = S.classes[0]?.id;
  S.scores ||= {}; S.mk ||= {}; S.att ||= {}; S.comments ||= {}; S.assessments ||= [];
}
function save(){

/* ================== Тооцоо ================== */
const cls = () => S.classes.find(c => c.id===S.ui.classId);
const termAs = (c, t) => S.assessments.filter(a => a.classId===c.id && a.term===t).sort((a,b) => (a.date||'').localeCompare(b.date||'') || 0);
// Тасалсан (Т), чөлөөтэй (Ч), өвчтэй (Ө) сурагчийн тухайн өдрийн бүх оноо автоматаар 0
const attMark = (a, sid) => { const r = a && a.date && (S.att[a.classId]||{})[a.date]; return (r && r.m && r.m[sid]) || ''; };
const absentOn = (a, sid) => attMark(a, sid)==='т';
const excusedOn = (a, sid) => ['ч','ө'].includes(attMark(a, sid));
// Ч/Ө: анхдагч 0; нөхөж өгсөн оноог S.mk-д тусад нь хадгална
const sc = (aid, sid) => { const a = S.assessments.find(x => x.id===aid); if(absentOn(a, sid)) return 0; const v = ((excusedOn(a, sid) ? (S.mk||{}) : S.scores)[aid]||{})[sid]; const n = v===undefined || v===null || v==='' ? null : +v; return n==null && excusedOn(a, sid) ? 0 : n; };
function letter(p){ if(p==null) return '—'; for(const s of S.settings.scale) if(p >= s.min) return s.l; return S.settings.scale.at(-1).l; }
function levelIdx(p){ if(p==null) return -1; return p>=90?4 : p>=80?3 : p>=70?2 : p>=60?1 : 0; }
function calc(c, st, t){
  const as = termAs(c, t); const per = {}; let tw=0, acc=0;
  for(const cat of S.settings.cats){
    let got=0, max=0;
    for(const a of as) if(a.cat===cat.id){ const v = sc(a.id, st.id); if(v==null) continue; got += v; max += +a.max; }
    per[cat.id] = max>0 ? got/max*100 : null;
    if(max>0 && +cat.w>0){ tw += +cat.w; acc += per[cat.id]*cat.w; }
  }
  const total = tw>0 ? acc/tw : null;
  // ахиц: сүүлийн 2 үнэлгээ
  const done = as.filter(a => sc(a.id, st.id)!=null);
  let trend = null;
  if(done.length>=2){ const a1 = done.at(-2), a2 = done.at(-1); trend = sc(a2.id,st.id)/a2.max*100 - sc(a1.id,st.id)/a1.max*100; }
  return {per, total, L:letter(total), lvl:levelIdx(total), trend, n:done.length};
}
function attOf(c, st, t){
  const days = S.att[c.id]||{}; let n=0, т=0, ч=0, ө=0, х=0;
  for(const d in days){ const r = days[d]; if(r.term!==t) continue; n++; const m = r.m[st.id]; if(m==='т')т++; else if(m==='ч')ч++; else if(m==='ө')ө++; else if(m==='х')х++; }
  return {n, т, ч, ө, х, pct: n ? (n-т-ч-ө)/n*100 : null};
}
function sortedStudents(c){
  const arr = [...c.students];
  if(S.ui.sort==='name') arr.sort(nameSort);
  if(S.ui.sort==='sub') arr.sort((a,b) => mnSort(a.sub||'',b.sub||'') || nameSort(a,b));
  if(S.ui.sort==='total') arr.sort((a,b) => (calc(c,b,S.ui.term).total??-1) - (calc(c,a,S.ui.term).total??-1));
  return arr;
}

        ${day ? `<p class="hint" style="margin:0 0 8px">${cnt}${day.term!==S.ui.term?` · <b>${day.term}-р улиралд</b> бүртгэгдсэн`:''}</p>` : `<p class="hint">Товч дармагц бүгдийг «Ирсэн» гэж бүртгэнэ — дараа нь ирээгүй хүүхдийг л тэмдэглэнэ.</p>`}
        <table>${list}</table>
      </div>
      <div class="card"><h2>Улирлын ирцийн хүснэгт</h2>${summary}</div>
    </div>`;
}
function setDate(d){ S.ui.date = d; save(); render(); }
function shiftDate(n){ const d = new Date(S.ui.date+'T12:00'); d.setDate(d.getDate()+n); setDate(d.toISOString().slice(0,10)); }
function ensureDay(){ const c = cls(); S.att[c.id] ||= {}; S.att[c.id][S.ui.date] ||= {term:S.ui.term, m:{}}; return S.att[c.id][S.ui.date]; }
function startDay(){ ensureDay(); save(); render(); }
function mark(sid, k){ const day = ensureDay(); if(k) day.m[sid] = k; else delete day.m[sid]; save(); render(); }
function allPresent(){ ensureDay().m = {}; save(); render(); }
function delDay(){ if(!confirm('Энэ өдрийн ирцийг устгах уу?')) return; delete S.att[cls().id][S.ui.date]; save(); render(); }

/* ================== Дүн ================== */
function catName(id){ return (S.settings.cats.find(c => c.id===id)||{name:'?'}).name; }
function vGrades(){
  const c = cls(); if(!c) return noClass();
  if(!c.students.length) return noStudents(c);
  const t = S.ui.term, as = termAs(c,t);
  // Өдрөөр бүлэглэх: өдөр бүр ээлжилсэн өнгө, зааглах шугамтай
  const dkeys = []; as.forEach(a => { const k = a.date||''; if(dkeys.at(-1)!==k) dkeys.push(k); });
  const dg = a => { const i = dkeys.indexOf(a.date||''); const first = as.find(x => (x.date||'')===(a.date||''))===a; return `dg${i%2}${first?' ds':''}`; };
  const WD = ['Ням','Даваа','Мягмар','Лхагва','Пүрэв','Баасан','Бямба'];
  const grp = dkeys.map((k,i) => `<th class="c dg${i%2} ds" colspan="${as.filter(a => (a.date||'')===k).length}">${k ? k.slice(5).replace('-','.') + `<span class="wd">${WD[new Date(k+'T12:00').getDay()]}</span>` : 'Огноогүй'}</th>`).join('');
  const head = as.map(a => `<th class="c ${dg(a)}"><div class="ah" onclick="editA('${a.id}')" title="Засах"><span class="t">${esc(a.title.replace(/^\d{1,2}\.\d{2}\s*/,'')||a.title)}</span><span class="m">${esc(catName(a.cat))} · ${a.max}</span></div></th>`).join('');
  const rows = sortedStudents(c).map(s => {
    const r = calc(c,s,t);
    return `<tr><td>${esc(s.name)}${s.sub?`<span class="subcl">${esc(s.sub)}</span>`:''}</td>
      ${as.map(a => { const v = sc(a.id,s.id); if(absentOn(a,s.id)) return `<td class="c ${dg(a)}"><input class="sc abs" value="0" disabled title="Тасалсан — оноо 0"></td>`; const ex = excusedOn(a,s.id); return `<td class="c ${dg(a)}"><input class="sc ${ex?'exc':''} ${v!=null && v>a.max?'bad':''}" ${ex?'title="Чөлөөтэй/өвчтэй — нөхөж өгсөн оноог бичиж болно"':''} data-a="${a.id}" data-s="${s.id}" value="${v==null?'':v}" inputmode="decimal"></td>`; }).join('')}
      <td class="n" id="tot-${s.id}">${totCell(r)}</td></tr>`;
  }).join('');
  const avgRow = as.length ? `<tr><td style="color:var(--muted)">Дундаж</td>${as.map(a => { const v = c.students.map(s => sc(a.id,s.id)).filter(x => x!=null); return `<td class="c hint ${dg(a)}">${v.length? fmt(v.reduce((x,y)=>x+y,0)/v.length/a.max*100)+'%' : ''}</td>`; }).join('')}<td></td></tr>` : '';
  return `<h1>Дүн · ${esc(c.name)}</h1><p class="sub">${t}-р улирал · ${as.length} үнэлгээ · оноогоо шууд бичээд Enter дарвал доошоо шилжинэ</p>
    <div class="row" style="margin-bottom:14px">
      <button class="btn pri" onclick="editA()">+ Үнэлгээ нэмэх</button>
      ${sortSel()}
    </div>
    ${as.length ? `<div class="tw"><table><thead><tr class="grp"><th rowspan="2">Сурагч</th>${grp}<th class="n" rowspan="2">Нийт</th></tr><tr class="sub2">${head}</tr></thead><tbody>${rows}${avgRow}</tbody></table></div>
      <p class="hint">Хоосон нүд тооцоонд орохгүй (тэг биш). Ирцэд «Т» (тасалсан), «Ч» (чөлөөтэй), «Ө» (өвчтэй) тэмдэглэсэн сурагчийн тэр өдрийн бүх оноо автоматаар 0 болно. «Т»-ийн оноо түгжээтэй; «Ч», «Ө»-ийн оноог (тасархай хүрээтэй нүд) нөхөж өгсөн бол засаж болно. Баганын гарчиг дээр дарж засна.</p>`
      : `<div class="card empty">Энэ улиралд үнэлгээ алга. «+ Үнэлгээ нэмэх» дарж сорил, лаборатори, даалгавар үүсгээрэй.</div>`}`;
}
function totCell(r){ return r.total==null ? '<span class="hint">—</span>' : `<b>${fmt(r.total,1)}</b> <span class="pill L-${r.L}">${r.L}</span>`; }
function sortSel(){ return `<select onchange="S.ui.sort=this.value;save();render()">
  <option value="name" ${S.ui.sort==='name'?'selected':''}>Нэрээр</option>
  <option value="sub" ${S.ui.sort==='sub'?'selected':''}>Ангиар (сонгон)</option>
  <option value="total" ${S.ui.sort==='total'?'selected':''}>Нийт оноогоор</option></select>`; }
function bindGrades(){
  document.querySelectorAll('input.sc:not([disabled])').forEach(inp => {
    inp.addEventListener('change', () => {
      const a = S.assessments.find(x => x.id===inp.dataset.a);
      let v = inp.value.trim().replace(',','.');
      const ST = inp.classList.contains('exc') ? (S.mk ||= {}) : S.scores;
      ST[a.id] ||= {};
      if(v===''){ delete ST[a.id][inp.dataset.s]; }
      else if(isNaN(+v) || +v<0){ toast('Тоо оруулна уу'); inp.value=''; delete ST[a.id][inp.dataset.s]; }
      else { ST[a.id][inp.dataset.s] = +v; if(+v > a.max) toast(`Дээд оноо ${a.max} — шалгаарай`); }
      inp.classList.toggle('bad', v!=='' && +v > a.max);
      save();
      const c = cls(), s = c.students.find(x => x.id===inp.dataset.s);
      document.getElementById('tot-'+s.id).innerHTML = totCell(calc(c,s,S.ui.term));
    });
    inp.addEventListener('keydown', e => {
      if(e.key==='Enter' || e.key==='ArrowDown' || e.key==='ArrowUp'){
        e.preventDefault();
        const col = [...document.querySelectorAll(`input.sc[data-a="${inp.dataset.a}"]:not([disabled])`)];
        const i = col.indexOf(inp) + (e.key==='ArrowUp' ? -1 : 1);
        if(col[i]){ col[i].focus(); col[i].select(); } else inp.blur();
      }
    });
    inp.addEventListener('focus', () => inp.select());
  });
}
function editA(id){
  const c = cls(); const a = id ? S.assessments.find(x => x.id===id) : {title:'', cat:S.settings.cats[0].id, max:10, date:today(), term:S.ui.term};
  modal(`<h2>${id?'Үнэлгээ засах':'Шинэ үнэлгээ'}</h2>

    <div class="two">
      <div class="fld"><label>Төрөл</label><select id="fC">${S.settings.cats.map(k => `<option value="${k.id}" ${k.id===a.cat?'selected':''}>${esc(k.name)} (${k.w}%)</option>`).join('')}</select></div>

function saveA(id){
  const title = document.getElementById('fT').value.trim() || 'Үнэлгээ';

function delA(id){ if(!confirm('Энэ үнэлгээ болон бүх оноог устгах уу?')) return; S.assessments = S.assessments.filter(x => x.id!==id); delete S.scores[id]; if(S.mk) delete S.mk[id]; save(); closeModal(); render(); }

/* ================== Нэгтгэл ================== */
function classSummary(c, t){
  const rows = sortedStudents(c).map(s => ({s, r:calc(c,s,t), a:attOf(c,s,t)}));
  const g = rows.filter(x => x.r.total!=null);
  const dist = {}; S.settings.scale.forEach(x => dist[x.l]=0); g.forEach(x => dist[x.r.L]++);
  const L = S.settings.scale.map(x => x.l);
  const pass = g.filter(x => x.r.L !== L.at(-1)).length;
  const qual = g.filter(x => L.indexOf(x.r.L) <= 2).length;
  const avg = g.length ? g.reduce((a,x)=>a+x.r.total,0)/g.length : null;
  const lv = [0,0,0,0,0]; g.forEach(x => lv[x.r.lvl]++);
  return {rows, g, dist, pass, qual, avg, lv};
}
function vSum(){
  const c = cls(); if(!c) return noClass();
  if(!c.students.length) return noStudents(c);
  const t = S.ui.term, R = classSummary(c,t), cats = S.settings.cats;
  const maxD = Math.max(1, ...Object.values(R.dist));
  const col = {A:'var(--sage)',B:'var(--sky)',C:'var(--sand)',D:'var(--lav)',F:'var(--coral)'};
  const table = `<div class="tw"><table><thead><tr><th>Сурагч</th>${cats.map(k => `<th class="n">${esc(k.name)}<br><span class="hint">${k.w}%</span></th>`).join('')}
    <th class="n">Нийт %</th><th class="c">Дүн</th>${S.settings.fun?'<th>Био түвшин</th>':''}<th class="c">Ахиц</th><th class="n">Ирц %</th><th class="n">Тасалсан</th><th class="noprint"></th></tr></thead><tbody>
    ${R.rows.map(({s,r,a}) => `<tr><td>${esc(s.name)}${s.sub?`<span class="subcl">${esc(s.sub)}</span>`:''}</td>
      ${cats.map(k => `<td class="n">${fmt(r.per[k.id])}</td>`).join('')}
      <td class="n"><b>${fmt(r.total,1)}</b></td><td class="c">${r.total==null?'—':`<span class="pill L-${r.L}">${r.L}</span>`}</td>
      ${S.settings.fun?`<td class="lvl">${r.lvl<0?'—':`<b>${LEVELS[r.lvl]}</b>`}</td>`:''}
      <td class="c">${r.trend==null?'<span class="hint">—</span>': r.trend>=3?`<span class="up">↑ ${fmt(r.trend)}</span>`: r.trend<=-3?`<span class="down">↓ ${fmt(-r.trend)}</span>`:'<span class="hint">→</span>'}</td>
      <td class="n">${fmt(a.pct)}</td><td class="n">${a.т||''}</td>
      <td class="noprint"><button class="btn sm ghost" onclick="cardOne('${s.id}')">Карт</button></td></tr>`).join('')}
    </tbody></table></div>`;
  return `<h1>Нэгтгэл · ${esc(c.name)}</h1><p class="sub">${t}-р улирал · ${S.settings.subject} · ${esc(S.settings.teacher)}</p>
    <div class="row noprint" style="margin-bottom:14px">
      ${sortSel()}
      <button class="btn" onclick="exportCSV()">Excel рүү (CSV)</button>
      <button class="btn" onclick="printSum()">Хэвлэх</button>
      <button class="btn" onclick="cardAll()">Бүх картыг хэвлэх</button>
      ${S.settings.fun?`<button class="btn pri" onclick="projector()">Ангид харуулах</button>`:''}
    </div>
    <div class="stats">
      <div class="stat"><div class="v">${fmt(R.avg,1)}${R.avg==null?'':'%'}</div><div class="l">Ангийн дундаж</div></div>
      <div class="stat"><div class="v">${R.g.length? fmt(R.pass/R.g.length*100)+'%':'—'}</div><div class="l">Амжилт (A–D)</div></div>
      <div class="stat"><div class="v">${R.g.length? fmt(R.qual/R.g.length*100)+'%':'—'}</div><div class="l">Чанар (A–C)</div></div>
      <div class="stat"><div class="v">${R.g.length}/${c.students.length}</div><div class="l">Дүн гарсан сурагч</div></div>
      <div class="stat" style="grid-column:span 2"><div class="bars">${Object.entries(R.dist).map(([l,n]) => `<div class="bar"><b>${n}</b><i style="height:${n/maxD*70}%;background:${col[l]||'var(--muted)'}"></i>${l}</div>`).join('')}</div></div>
    </div>
    ${table}
    <p class="hint">Нийт % = ангилал бүрийн хувийг жингээр нь дунджилсан (оноо орсон ангиллууд л тооцогдоно). Ахиц = сүүлийн 2 үнэлгээний хувийн зөрүү.</p>`;
}
function exportCSV(){
  const c = cls(), t = S.ui.term, R = classSummary(c,t), cats = S.settings.cats;
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const lines = [[ '№','Овог нэр','Анги', ...cats.map(k => `${k.name} (${k.w}%)`), 'Нийт %','Дүн','Ирц %','Тасалсан','Чөлөөтэй','Өвчтэй','Хоцорсон' ].map(q).join(',')];
  R.rows.forEach(({s,r,a},i) => lines.push([i+1, s.name, s.sub||c.name, ...cats.map(k => r.per[k.id]==null?'':fmt(r.per[k.id],1)), r.total==null?'':fmt(r.total,1), r.total==null?'':r.L, a.pct==null?'':fmt(a.pct), a.т, a.ч, a.ө, a.х].map(q).join(',')));
  download(`${c.name}_${t}-р улирал_нэгтгэл.csv`, '﻿'+lines.join('\r\n'), 'text/csv');
}
function printSum(){ document.body.classList.add('printing-sum'); window.print(); setTimeout(() => document.body.classList.remove('printing-sum'), 500); }

function projector(){

    <div class="plants">${LEVELS.map((l,i) => `<div class="pl"><div class="c">${R.lv[i]}</div><div class="stem" style="height:0;opacity:${.45+i*.13}" data-h="${R.lv[i]/mx*80}"></div><div class="n">${l}</div></div>`).join('')}</div>
    <div class="avg">Ангийн дундаж <b>${fmt(R.avg,1)}%</b> · Эс → Эд → Эрхтэн → Тогтолцоо → Организм</div>`;

document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeProj(); closeModal(); } });
document.addEventListener('fullscreenchange', () => { if(!document.fullscreenElement) document.getElementById('proj')?.remove(); });

/* ================== Сурагчид ================== */
function vStudents(){
  const c = cls(); if(!c) return noClass();
  const list = sortedStudents(c).map((s,i) => `<tr><td class="n hint">${i+1}</td><td>${esc(s.name)}</td><td>${esc(s.sub)}</td>

    <div class="two">
      <div class="card">${c.students.length ? `<div class="row" style="margin-bottom:8px">${sortSel()}</div><table><thead><tr><th class="n">№</th><th>Овог нэр</th><th>Анги</th><th></th></tr></thead><tbody>${list}</tbody></table>` : '<div class="empty">Сурагч алга</div>'}</div>
      <div class="card"><h2>Нэрс нэмэх</h2>
        <p class="hint">Мөр бүрт нэг сурагч. eSchool эсвэл Excel-ээс хуулж тавьж болно. Сонгон хичээлд анги нэмэх бол: <code>Б. Мөнхбат ; 10а</code></p>
        <textarea id="fPaste" rows="12" style="width:100%" placeholder="Б. Анужин&#10;Г. Тэмүүлэн&#10;Д. Номин"></textarea>
        <div class="row" style="margin-top:10px"><button class="btn pri" onclick="addPaste()">Нэмэх</button></div>
      </div>
    </div>`;
}
function addPaste(){
  const c = cls(), lines = document.getElementById('fPaste').value.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  let n = 0;
  lines.forEach(l => { let [name, sub] = l.split(/\s*[;\t]\s*/); name = name.replace(/^\d+[\.\)]?\s*/, '').trim(); if(name){ c.students.push({id:uid(), name, sub:(sub||'').trim()}); n++; } });
  save(); render(); toast(`${n} сурагч нэмэгдлээ`);
}
function editS(id){
  const s = cls().students.find(x => x.id===id);
  modal(`<h2>Сурагч засах</h2>
    <div class="fld"><label>Овог нэр</label><input type="text" id="fN" value="${esc(s.name)}"></div>
    <div class="fld"><label>Анги (сонгон хичээлд)</label><input type="text" id="fS" value="${esc(s.sub)}"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Болих</button><button class="btn pri" onclick="saveS('${id}')">Хадгалах</button></div>`);
}
function saveS(id){ const s = cls().students.find(x => x.id===id); s.name = document.getElementById('fN').value.trim() || s.name; s.sub = document.getElementById('fS').value.trim(); save(); closeModal(); render(); }
function delS(id){
  const c = cls(), s = c.students.find(x => x.id===id);
  if(!confirm(`${s.name}-г ангиас хасах уу? Түүний оноо, ирц мөн устна.`)) return;
  c.students = c.students.filter(x => x.id!==id);
  for(const a in S.scores) delete S.scores[a][id];
  for(const a in (S.mk||{})) delete S.mk[a][id];
  for(const d in (S.att[c.id]||{})) delete S.att[c.id][d].m[id];
  save(); render();
}

/* ================== Тохиргоо ================== */
function vSettings(){
  const st = S.settings; const sum = st.cats.reduce((a,k)=>a+(+k.w||0),0);
  return `<h1>Тохиргоо</h1><p class="sub">Өгөгдөл зөвхөн энэ компьютерийн хөтөч дотор хадгалагдана — интернэт хэрэггүй.</p>
  <div class="two">
    <div class="card"><h2>Ерөнхий</h2>
      <div class="fld"><label>Багшийн нэр</label><input type="text" value="${esc(st.teacher)}" onchange="S.settings.teacher=this.value;save();render()"></div>
      <div class="fld"><label>Сургууль</label><input type="text" value="${esc(st.school)}" onchange="S.settings.school=this.value;save();render()"></div>
      <div class="two"><div class="fld"><label>Хичээл</label><input type="text" value="${esc(st.subject)}" onchange="S.settings.subject=this.value;save();render()"></div>
      <div class="fld"><label>Хичээлийн жил</label><input type="text" value="${esc(st.year)}" onchange="S.settings.year=this.value;save();render()"></div></div>
      <div class="two"><div class="fld"><label>Улирлын тоо</label><select onchange="S.settings.terms=+this.value;if(S.ui.term>S.settings.terms)S.ui.term=1;save();render()">${[2,3,4].map(n=>`<option ${n===st.terms?'selected':''}>${n}</option>`).join('')}</select></div>
      <div class="fld"><label>Био түвшин, ангид харуулах</label><select onchange="S.settings.fun=this.value==='1';save();render()"><option value="1" ${st.fun?'selected':''}>Асаалттай</option><option value="0" ${!st.fun?'selected':''}>Унтраалттай</option></select></div></div>
    </div>
    <div class="card"><h2>Дүнгийн бүрэлдэхүүн (жин)</h2>
      <table><tbody>${st.cats.map((k,i) => `<tr><td><input type="text" value="${esc(k.name)}" onchange="S.settings.cats[${i}].name=this.value;save()" style="width:100%"></td>
        <td style="width:90px"><input type="number" min="0" max="100" value="${k.w}" onchange="S.settings.cats[${i}].w=+this.value;save();render()" style="width:70px"> %</td>
        <td style="width:40px">${st.cats.length>1?`<button class="btn sm ghost dan" onclick="delCat(${i})">×</button>`:''}</td></tr>`).join('')}</tbody></table>
      <div class="row" style="margin-top:8px;justify-content:space-between"><button class="btn sm" onclick="S.settings.cats.push({id:uid(),name:'Шинэ ангилал',w:0});save();render()">+ Ангилал</button>
      <span class="${sum===100?'up':'down'}">Нийт: ${sum}%${sum===100?'':' — 100 болгоорой'}</span></div>
      <h2 style="margin-top:18px">Үсгэн үнэлгээний босго</h2>
      <div class="row">${st.scale.map((x,i) => `<label class="row" style="gap:4px"><span class="pill L-${x.l}">${x.l}</span> ≥ <input type="number" value="${x.min}" style="width:62px" onchange="S.settings.scale[${i}].min=+this.value;save()"></label>`).join('')}</div>
    </div>
  </div>
  <div class="card"><h2>Ангиуд</h2>
    <table><thead><tr><th>Нэр</th><th>Төрөл</th><th class="n">Сурагч</th><th></th></tr></thead><tbody>
    ${S.classes.map((c,i) => `<tr><td><input type="text" value="${esc(c.name)}" onchange="S.classes[${i}].name=this.value;save();render()"></td>
      <td><select onchange="S.classes[${i}].kind=this.value;save();render()"><option ${c.kind==='Үндсэн'?'selected':''}>Үндсэн</option><option ${c.kind==='Сонгон'?'selected':''}>Сонгон</option></select></td>
      <td class="n">${c.students.length}</td><td style="text-align:right"><button class="btn sm ghost dan" onclick="delClass('${c.id}')">Устгах</button></td></tr>`).join('')}
    </tbody></table>
    <button class="btn sm" style="margin-top:10px" onclick="addClass()">+ Анги нэмэх</button>
  </div>
  <div class="card"><h2>Нөөц ба шилжүүлэх</h2>
    <p class="hint">Нөөц файлаа (.json) Google Drive эсвэл флаш руу хуулж хадгалаарай. Өөр компьютерт энэ апп-аа нээгээд «Нөөцөөс сэргээх» дарвал бүх өгөгдөл буцаж орно.</p>
    <div class="row"><button class="btn pri" onclick="exportJSON()">Нөөц татах</button>
      <label class="btn">Нөөцөөс сэргээх<input type="file" accept=".json" style="display:none" onchange="importJSON(this.files[0])"></label>
      <span style="flex:1"></span><button class="btn ghost dan" onclick="wipe()">Бүх өгөгдлийг устгах</button></div>
    <p class="hint">Сүүлийн нөөц: ${st.lastBackup? new Date(st.lastBackup).toLocaleString('mn-MN') : 'хийгээгүй'}</p>
  </div>`;
}
function delCat(i){ const k = S.settings.cats[i]; if(S.assessments.some(a => a.cat===k.id) && !confirm('Энэ ангилалд үнэлгээ байна. Устгавал тэр үнэлгээнүүд дүнд тооцогдохгүй. Үргэлжлүүлэх үү?')) return; S.settings.cats.splice(i,1); save(); render(); }
function addClass(){ const n = prompt('Ангийн нэр (ж: 10Б)'); if(!n) return; const c = {id:uid(), name:n.trim(), kind:'Үндсэн', grade:parseInt(n)||0, students:[]}; S.classes.push(c); S.ui.classId = c.id; save(); render(); }
function delClass(id){
  const c = S.classes.find(x => x.id===id);
  if(!confirm(`${c.name} ангийг бүх сурагч, дүн, ирцтэй нь устгах уу?`)) return;
  S.assessments.filter(a => a.classId===id).forEach(a => delete S.scores[a.id]);
  S.assessments = S.assessments.filter(a => a.classId!==id); delete S.att[id];
  S.classes = S.classes.filter(x => x.id!==id); fix(); save(); render();
}
function download(name, text, type){ const b = new Blob([text], {type}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
function exportJSON(){ S.settings.lastBackup = Date.now(); save(); download(`bagshiin-journal-noots-${today()}.json`, JSON.stringify(S,null,1), 'application/json'); render(); toast('Нөөц татагдлаа'); }
function importJSON(f){
  if(!f) return; const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); if(!d.classes || !d.settings) throw 0; if(!confirm('Одоогийн өгөгдлийг нөөцийн өгөгдлөөр солих уу?')) return; S = d; fix(); save(); render(); toast('Сэргээгдлээ'); } catch(e){ alert('Энэ файл журналын нөөц биш байна.'); } };
  r.readAsText(f);
}
function wipe(){ if(prompt('Бүх өгөгдөл устана. Итгэлтэй бол УСТГА гэж бичнэ үү')!=='УСТГА') return; localStorage.removeItem(KEY); S = seed(); save(); render(); }

/* ================== Туслах ================== */
function modal(h, wide){ closeModal(); const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal'; m.innerHTML = `<div class="box ${wide?'wide':''}">${h}</div>`; m.onclick = e => { if(e.target===m) closeModal(); }; document.body.appendChild(m); }
function closeModal(){ document.getElementById('modal')?.remove(); }
function noClass(){ return `<div class="card empty">Анги алга. Тохиргоо хэсэгт анги нэмнэ үү.</div>`; }
function noStudents(c){ return `<h1>${esc(c.name)}</h1><div class="card empty">Энэ ангид сурагч алга.<br><br><button class="btn pri" onclick="go('students')">Сурагчдын нэрс оруулах</button></div>`; }

load(); render();
</script>
</body>
</html>
